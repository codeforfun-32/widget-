[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Media_Control",
    "Devices_Radios",
    "Devices_Geolocation",
    "Storage_Streams",
    "Foundation"
] }
windows-future = "0.3"
cpal = "0.15"
arboard = "3.7"
sysinfo = "0.33"
serde_json = "1.0"
ureq = "2.10"
rusqlite = { version = "0.32", features = ["bundled"] }
raw-window-handle = "0.6"
image = "0.25"

[build-dependencies]
slint-build = "1.18"