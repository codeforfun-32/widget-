[package]
name = "widgets-app"
version = "0.1.0"
edition = "2021"

[features]
default = ["video"]
# MP4 playback through Windows Media Foundation. If it ever fails to build, delete the line
# above that says default = ["video"] (set it to default = []) and everything else still works.
video = []

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
shared = { path = "../shared" }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
ureq = "2.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }

windows-future = "0.3"

[build-dependencies]
slint-build = "1.18"
